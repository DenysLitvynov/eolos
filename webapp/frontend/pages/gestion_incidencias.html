<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Éolos - Incidencias</title>
    <!-- Incluimos los estilos, asumiendo que el archivo CSS se llama estilos_incidencias.css -->
    <link rel="stylesheet" href="../css/gestion_incidencias.css" />
    <link rel="stylesheet" href="../css/generales.css" />
    <link rel="stylesheet" href="../css/header.css">
    <!-- Iconos para la barra de navegación (simulando los del diseño) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <script type="module" src="/js/components/header.js" defer></script>
     <link rel="stylesheet" href="/css/footer.css">
    <script type="module" src="/js/components/footer.js" defer></script>

</head>

<body>
       
    <div id="site-header"></div>

    <main class="contenedor-principal">
        <h1>Incidencias</h1>
        
        <div class="barra-busqueda-filtros">
            <!-- Barra de búsqueda -->
            <div class="contenedor-busqueda">
                <input type="text" class="campo-busqueda" placeholder="Buscar una incidencia Específica">
                <i class="icono-busqueda fas fa-search"></i>
            </div>
            
            <!-- Botones de filtro -->
            <div class="botones-filtro">
                <button class="boton-filtro"><i class="fas fa-arrow-up"></i></button>
                <button class="boton-filtro"><i class="fas fa-arrow-down"></i></button>
                <button class="boton-filtro"><i class="fas fa-filter"></i></button>
            </div>
        </div>

        <!-- Contenedor de las tarjetas de incidencia (Grid) -->
        <div class="grid-incidencias" id="grid-incidencias">

        </div>
    </main>

    <div id="site-footer"></div>
    
    <script type="module" src="../js/scripts/gestion_incidencias.js"></script>

    <script type="module">
        // Actualiza el nombre del usuario en el header si hay token JWT
        async function actualizarNombreUsuarioHeader() {
            const link = document.getElementById('user-link');
            if (!link) return;
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/api/v1/perfil', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) return;
                const perfil = await res.json();
                const nombre = perfil.nombre || perfil.correo || null;
                if (nombre) link.innerHTML = `<b>${nombre}</b>`;
            } catch (e) {
                console.warn('No se pudo obtener perfil para header:', e);
            }
        }
        actualizarNombreUsuarioHeader();
    </script>



</body>

    
    
</html>
