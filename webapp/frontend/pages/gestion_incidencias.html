    <script type="module">
        // Actualiza el nombre del usuario en el header si hay token JWT
        async function actualizarNombreUsuarioHeader() {
            const link = document.getElementById('user-link');
            if (!link) return;
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/api/v1/perfil', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) return;
                const perfil = await res.json();
                const nombre = perfil.nombre || perfil.correo || null;
                if (nombre) link.innerHTML = `<b>${nombre}</b>`;
            } catch (e) {
                console.warn('No se pudo obtener perfil para header:', e);
            }
        }
        actualizarNombreUsuarioHeader();
    </script>
