<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éolos – Sensores</title>

    <link rel="stylesheet" href="../../css/header.css">
    <link rel="stylesheet" href="../../css/estado-sensores.css">

    <script type="module" src="../../js/scripts/estado-sensores.js" defer></script>
    <script type="module" src="/js/components/header.js" defer></script>

    <!-- <link rel="stylesheet" href="../../css/estado-sensores.css"> -->

    <link rel="stylesheet" href="/css/footer.css">
    <script type="module" src="/js/components/footer.js" defer></script>

</head>
<body>
    
   <div id="site-header"></div>
    
   <main class="bike-page">
        <h1 class="page-title">Lista de Sensores</h1>
    
        <!-- Buscador + Estado + Estación + Última Actualización -->
        <div class="filters">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por id o zona">
                <button id="searchBtn">
                    <span class="material-icon">🔍</span>
                </button>
            </div>
    
            <div class="state-filters">
                <span>Estado:</span>
                <button class="state-btn" data-state="activa">Activa</button>
                <button class="state-btn" data-state="danada">Dañada</button>
                <button class="state-btn" data-state="desactivada">Desactivado</button>
            </div>
    
            <div class="station-filters">
                <label for="selectEstacion">Estación:</label>
                <select id="selectEstacion">
                    <option value="">Todas las estaciones</option>
                    <!-- Se llenará dinámicamente -->
                </select>
            </div>
    
            <div class="update-filters">
                <label for="selectActualizacion">Última actualización:</label>
                <select id="selectActualizacion">
                    <option value="">Todas</option>
                    <option value="24h">Últimas 24h</option>
                    <option value="7d">Últimos 7 días</option>
                    <option value="30d">Últimos 30 días</option>
                    <option value="sin">Sin actualizar</option>
                </select>
            </div>

            <button id="btnLimpiarTodosFiltros" class="btn-limpiar-todos">Limpiar filtros</button>
        </div>
    
        <!-- Contenedor de tarjetas -->
        <section id="bikeList" class="bike-list"></section>

        <!-- MODAL DE MEDICIONES -->
        <div id="modalMediciones" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Mediciones - <span id="modalPlacaId"></span></h2>
                    <button id="cerrarModal" class="btn-cerrar">&times;</button>
                </div>
        
                <!-- Filtro por fechas -->
                <div class="modal-filtros">
                    <label>Desde:</label>
                    <input type="datetime-local" id="filtroFechaInicio">
                    <label>Hasta:</label>
                    <input type="datetime-local" id="filtroFechaFin">
                    <button id="btnAplicarFiltros" class="btn-filtrar">Aplicar filtros</button>
                    <button id="btnLimpiarFiltros" class="btn-limpiar">Limpiar filtros</button>
                </div>
        
                <!-- Tabla de mediciones -->
                <div class="modal-tabla-container">
                    <table id="tablaMediciones" class="tabla-mediciones">
                        <thead>
                            <tr>
                                <th>Fecha/Hora</th>
                                <th>Tipo</th>
                                <th>Valor</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            <!-- Se llenará dinámicamente -->
                        </tbody>
                    </table>
                </div>
        
                <!-- Botones de acción -->
                <div class="modal-acciones">
                    <button id="btnEliminarAnómalas" class="btn-danger">Eliminar todas las anómalas</button>
                    <button id="btnCerrarModal2" class="btn-secondary">Cerrar</button>
                </div>
            </div>
        </div>
        
        <!-- MODAL DE CONFIRMACIÓN -->
        <div id="modalConfirmacion" class="modal-confirmacion">
            <div class="confirmacion-content">
                <h3>Confirmación</h3>
                <p id="textoConfirmacion"></p>
                <div class="confirmacion-botones">
                    <button id="btnConfirmarEliminar" class="btn-danger">Eliminar</button>
                    <button id="btnCancelarEliminar" class="btn-secondary">Cancelar</button>
                </div>
            </div>
        </div>
    </main>
 
    <div class="form-footer">
        
    </div>
</body>
</html>
