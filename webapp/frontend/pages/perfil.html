<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <!--Enlaces a hojas de estilo -->
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/generales.css" />
    <link rel="stylesheet" href="../css/perfil.css" />
  <script type="module" src="/js/components/header.js" defer></script>
  <link rel="stylesheet" href="/css/footer.css">
  <script type="module" src="/js/components/footer.js" defer></script>
</head>

<body>

    <div id="site-header"></div>


<!-- ========================================= -->
<!-- CONTENEDOR PRINCIPAL DEL PERFIL -->
<!-- ========================================= -->
<div class="auth-container">
    <div class="background"></div>

    <div class="form-section">
        <h1 class="auth-title">Perfil</h1>

        <form id="registroForm" novalidate>
            <!-- NOMBRE -->
            <label for="nombre" class="input-label">Nombre y apellido</label>
            <input type="text" id="nombre" placeholder="Nombre Apellido" autocomplete="name" required />
            <span class="help-text">Campo obligatorio</span>
            <span class="error-message" id="nombreError"></span>

            <!-- CORREO -->
            <label for="correo" class="input-label">Correo o número de teléfono</label>
            <input type="text" id="correo" placeholder="juanba@gmail.com" autocomplete="email" inputmode="email" required />
            <span class="help-text">Debe ser un correo o número de teléfono válido</span>
            <span class="error-message" id="correoError"></span>

            <!-- TARJETA -->
            <label for="targeta_id" class="input-label">ID Tarjeta</label>
            <input type="text" id="targeta_id" placeholder="12345HDC" autocomplete="off" required />
            <span class="help-text">Formato según tu tarjeta de usuario</span>
            <span class="error-message" id="targeta_idError"></span>

            <!-- CONTRASEÑA ACTUAL -->
            <label for="contrasena_actual" class="input-label">Contraseña actual</label>
            <div class="password-wrapper">
                <input
                        type="password"
                        id="contrasena_actual"
                        placeholder="Introduce tu contraseña actual"
                        autocomplete="current-password"
                        required
                />
                <button type="button" class="toggle-password">Mostrar</button>
            </div>
            <span class="help-text">Necesaria para confirmar los cambios de tu perfil</span>
            <span class="error-message" id="contrasena_actualError"></span>

            <!-- NUEVA CONTRASEÑA -->
            <label for="nueva_contrasena" class="input-label">Nueva contraseña</label>
            <div class="password-wrapper">
                <input
                        type="password"
                        id="nueva_contrasena"
                        placeholder="Nueva contraseña"
                        autocomplete="new-password"
                />
                <button type="button" class="toggle-password">Mostrar</button>
            </div>
            <span class="help-text">
                Mínimo 8 caracteres, debe incluir: mayúsculas, minúsculas, números y símbolos (@$!%*?&)
            </span>
            <span class="error-message" id="nueva_contrasenaError"></span>

            <!-- REPITE NUEVA CONTRASEÑA -->
            <label for="repetir_contrasena" class="input-label">Repite la nueva contraseña</label>
            <div class="password-wrapper">
                <input
                        type="password"
                        id="repetir_contrasena"
                        placeholder="Repite la nueva contraseña"
                        autocomplete="new-password"
                />
                <button type="button" class="toggle-password">Mostrar</button>
            </div>
            <span class="help-text">Debe coincidir con la nueva contraseña</span>
            <span class="error-message" id="repetir_contrasenaError"></span>


            <div class="buttonperfil" style="display: flex; gap: 12px; margin-top: 8px;">
                <button type="button" class="btn-primary">Guardar</button>
                <button type="button" class="btn-segundo">Volver a principio</button>
            </div>
        </form>

        <!-- Mensaje general para feedback (opcional, como en registro) -->
        <div id="mensajePerfil" class="display-box"></div>
    </div>
</div>

<div id="site-footer"></div>

<script>
    (function(){
        const header = document.querySelector('.header');
        const nav = header.querySelector('.nav');
        const btn = header.querySelector('.menu-toggle');

        function closeMenu(){
            btn.setAttribute('aria-expanded', 'false');
            nav.classList.remove('is-open');
        }

        function openMenu(){
            btn.setAttribute('aria-expanded', 'true');
            nav.classList.add('is-open');
        }

        btn.addEventListener('click', () => {
            const expanded = btn.getAttribute('aria-expanded') === 'true';
            expanded ? closeMenu() : openMenu();
        });

        window.addEventListener('resize', () => {
            if(window.innerWidth > 1050) closeMenu();
        });
    })();
</script>

<script type="module" src="../js/scripts/perfil.js"></script>
</body>
</html>
