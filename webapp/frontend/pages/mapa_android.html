<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapas</title>

  <link rel="stylesheet" href="/css/generales.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/mapa.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="/js/lib/leaflet.heat.js"></script>
</head>

<body>
  <div class="map-container">
    <aside class="sidebar">
      <h2>Filtros</h2>

      <div class="filter-section">
        <h3>Capas</h3>
        <label><input type="checkbox" id="layer-bikes" checked>Bicicletas</label>
        <label><input type="checkbox" id="layer-pollution" checked>Contaminación</label>
      </div>

      <div class="filter-section">
        <h3>Tipo de gas</h3>
        <div class="select-wrapper">
          <select id="gas-select">
            <option value="general">Calidad General</option>
            <option value="pm25">PM 2.5</option>
            <option value="pm10">PM 10</option>
            <option value="no2">NO2</option>
            <option value="o3">O3</option>
          </select>
        </div>
      </div>

      <div class="filter-section">
        <h3>Hora</h3>
        <input type="range" id="hour-slider" min="0" max="23" value="12" step="1">
        <span id="hour-display">12:00</span>
      </div>


    </aside>

    <button id="toggle-sidebar">
      <svg viewBox="0 0 24 24">
        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <div id="map"></div>

    <div class="map-legend">
      <div class="legend-item">
        <span class="dot good"></span>
        <span>Buena</span>
      </div>
      <div class="legend-item">
        <span class="dot moderate"></span>
        <span>Moderada</span>
      </div>
      <div class="legend-item">
        <span class="dot unhealthy"></span>
        <span>Mala</span>
      </div>
    </div>
  </div>

  <section class="pollution-info">
    <h2>Niveles de Calidad del Aire</h2>

    <div style="text-align: center; padding: 1rem;">
      <p style="font-size: 1rem; margin-bottom: 1.5rem;">
        Vivir en un entorno con buena calidad del aire es fundamental, ya que una mala calidad tiene consecuencias
        nocivas para la salud.
      </p>
      <a href="informacion_android.html" class="pollution-btn"
        style="display: inline-block; text-decoration: none; color: var(--c-primary); border: 2px solid var(--c-primary); padding: 10px 20px; border-radius: 30px; font-weight: bold; transition: all 0.3s;">
        Ver información
      </a>
    </div>
  </section>

  <script type="module" src="../js/scripts/mapa.js"></script>

</body>

</html>
