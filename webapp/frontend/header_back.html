<header class="header header-back" data-breakpoint="1050">
  <div class="logo">
    <img src="/images/logo.png" alt="logo" />
  </div>

  <!-- Botón hamburger: lo dejamos en el HTML para que la estructura sea idéntica
       (pero lo ocultamos por CSS en esta variante) -->
  <button class="menu-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Abrir menú">
    <svg class="menu-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 6h18M3 12h18M3 18h18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round" />
    </svg>
    <span class="menu-toggle__label">Menú</span>
  </button>

  <!-- Menú con un único enlace -->
  <nav class="nav" id="site-nav">
    <button type="button" class="login header-back__btn" data-action="back">
  Volver atrás
</button>
  </nav>
</header>
